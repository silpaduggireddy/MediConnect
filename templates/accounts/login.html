{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">

        <div class="card shadow-sm">
            <div class="card-body">

                <h4 class="text-center mb-4">
                    Login with Phone
                </h4>

                {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">
                            Phone Number
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            placeholder="Enter phone number"
                            maxlength="10"
                            pattern="[0-9]{10}"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn btn-success w-100"
                    >
                        Send OTP
                    </button>

                </form>

                <div class="text-center mt-3">

                    <span>
                        Don't have an account?
                    </span>

                    <a
                        href="{% url 'phone_register' %}"
                        class="btn btn-outline-primary btn-sm"
                    >
                        Register
                    </a>

                </div>

            </div>
        </div>

    </div>
</div>
{% endblock %}
