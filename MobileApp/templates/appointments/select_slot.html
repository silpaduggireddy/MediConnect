{% extends "base.html" %}

{% block title %}Select Slot{% endblock %}

{% block content %}
<h3 class="mb-4">Book Appointment with {{ doctor.name }}</h3>

<div class="card shadow-sm">
    <div class="card-body">

        <!-- ❌ NO DIRECT PAYMENT HERE -->
        <form id="bookingForm">
            {% csrf_token %}

            <!-- 🔹 Consultation type (ONLINE / CLINIC) -->
            <input
                type="hidden"
                id="consultationType"
                value="{{ request.GET.type|default:'ONLINE' }}"
            >

            <!-- 📅 DATE SELECT -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Select Date</label>
                <input
                    type="date"
                    id="datePicker"
                    class="form-control"
                    min="{{ today }}"
                    required
                >
            </div>
            <!--PATIENT NAME-->
            <div class="mb-3">
                <label for="patient_name" class="form-control fw-bold">Patient Name</label>
                <input type="text"
                       id="patient_name"
                       name="patient_name"
                       class="form-control"
                       placeholder="Enter Patient Name"
                       required>
            </div>
            <!--SELECT AGE-->
            <div class="mb-3">
                 <label for="age" class="form-label fw-bold">Age</label>
                 <input
                      type="number"
                      id="age"
                      name="age"
                      class="form-control"
                      min="1"
                      placeholder="Enter Age"
                      max="99"
                      placeholder="Enter Age"
                      required>
            </div>
            <!--SELECT GENDER-->
            <div class="mb-3">
                <label for="gender" class="form-label fw-bold">Gender</label>
                <select id="gender"
                        name="gender"
                        class="form-select"
                        required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    </select>
            </div>
            <!--PREVIOUS CURRENT HEALTH PROBLEM-->
            <div class="mb-3">
                 <label for="previous_problem" class="form-label fw-bold">Previous Health Problem</label>
                 <textarea id="previous_problem"
                          name="previous_problem"
                          class="form-control"
                          rows="2"
                          placeholder="Enter previous health problems (if any)">
                  </textarea>
                </div>
            <!--CURRENT HEALTH PROBLEM-->
            <div class="mb-3">
                 <label for="current_problem" class="form-label fw-bold">Current Health Problem</label>
                 <textarea id="current_problem"
                         name="current_problem"
                         class="form-control"
                         rows="2"
                         placeholder="Describe your current health problem"
                         required>
                  </textarea>
            </div>
            <!--WHATSAPP NUMBER-->
            <div class="mb-3">
                 <label for="Whatsapp" class="form-label fw-bold">Whatsapp Number</label>
                 <input type="tel"
                        id="Whatsapp"
                        name="Whatsapp"
                        class="form-control"
                        maxlength="10"
                        placeholder="Enter 10-digit Whatsapp number"
                        required>
            </div>

            <!-- ⏰ SLOT DROPDOWN -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Available Slots</label>
                <select
                    id="slotDropdown"
                    class="form-select"
                    required
                    disabled
                >
                    <option value="">Select a date first</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success w-100">
                Book Appointment
            </button>
        </form>

    </div>
</div>

<script>
const datePicker = document.getElementById("datePicker");
const slotDropdown = document.getElementById("slotDropdown");
const form = document.getElementById("bookingForm");


const slotsUrl = "{% url 'appointments:slots_by_date' doctor.id %}";
const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

/* 🚫 BLOCK WEEKENDS */
datePicker.addEventListener("change", function () {
    const selectedDate = new Date(this.value);
    const day = selectedDate.getDay();

    if (day === 0 || day === 6) {
        alert("Appointments are not available on weekends");
        this.value = "";
        slotDropdown.innerHTML =
            '<option value="">Select a weekday</option>';
        slotDropdown.disabled = true;
        return;
    }

    /* 📡 FETCH AVAILABLE SLOTS */
    slotDropdown.innerHTML = '<option>Loading...</option>';
    slotDropdown.disabled = true;

    fetch(`${slotsUrl}?date=${this.value}`)
        .then(res => res.json())
        .then(data => {
            slotDropdown.innerHTML = "";

            if (!data.slots || data.slots.length === 0) {
                slotDropdown.innerHTML =
                    '<option value="">No slots available</option>';
            } else {
                slotDropdown.innerHTML =
                    '<option value="">Select a slot</option>';

                data.slots.forEach(slot => {
                    const option = document.createElement("option");
                    option.value = slot.id;
                    option.textContent = slot.label;
                    slotDropdown.appendChild(option);
                });
            }

            slotDropdown.disabled = false;
        })
        .catch(() => {
            slotDropdown.innerHTML =
                '<option value="">Error loading slots</option>';
        });
});

/* ✅ FINAL BOOKING LOGIC */
form.addEventListener("submit", function (e) {
    e.preventDefault();

    const slotId = slotDropdown.value;
    const consultationType =
        document.getElementById("consultationType").value || "ONLINE";
        
    

    if (!slotId) {
        alert("Please select a slot");
        return;
    }

    fetch("{% url 'appointments:book_appointment' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken
        },
        body:JSON.stringify({
            slot_id:slotId,
            consultation_type:consultationType,
            patient_name: document.getElementById("patient_name") .value,
            age: document.getElementById("age") .value,
            gender: document.getElementById("gender") .value,
            previous_health_problem: document.getElementById("previous_problem") .value,
            current_health_problem: document.getElementById("current_problem") .value,
            whatsapp_number: document.getElementById("Whatsapp") .value,
        })
    })
    .then(res => res.json())
    .then(data => {

        /* 💳 ONLINE → GO TO PAYMENT */
        if (data.status === "PAYMENT_REQUIRED") {
            window.location.href = `/payment/${data.appointment_id}/`;

            return;
        }

        /* 🏥 CLINIC → CONFIRM ONLY */
        alert(data.message);
        window.location.href = "{% url 'appointments:appointment_history' %}";
    })
    .catch(() => {
        alert("Something went wrong. Please try again.");
    });
});
</script>

{% endblock %}
